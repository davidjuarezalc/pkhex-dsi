name: Build and Release PKHeX DSi

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/pull') && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .nds with BlocksDS
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.18.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: git config --global safe.directory '*'

      - name: Install build tools
        run: |
          if [ -f tools-linux/bmp2ds ]; then
            cp tools-linux/bmp2ds /usr/local/bin/bmp2ds
          else
            curl -sL https://github.com/Universal-Team/bmp2ds/releases/download/v1.0.0/bmp2ds-linux -o /usr/local/bin/bmp2ds
          fi
          chmod +x /usr/local/bin/bmp2ds

          if [ -f tools-linux/make_cia ]; then
            cp tools-linux/make_cia /usr/local/bin/make_cia
            chmod +x /usr/local/bin/make_cia
          fi

      - name: Compile PKHeX DSi
        run: |
          make -j$(nproc)
          mkdir -p artifacts
          cp -f pkhex_dsi.nds artifacts/ 2>/dev/null || cp -f pkmn-chest.nds artifacts/pkhex_dsi.nds

          make cia || true
          if [ -f pkhex_dsi.cia ]; then
            cp -f pkhex_dsi.cia artifacts/
          elif [ -f pkmn-chest.cia ]; then
            cp -f pkmn-chest.cia artifacts/pkhex_dsi.cia
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkhex-dsi-build
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pkhex-dsi-build
          path: release_assets

      - name: Compute Release Metadata
        id: meta
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
            NAME="PKHeX DSi $TAG"
            PRERELEASE=false
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG="v1.0.${{ github.run_number }}"
            NAME="PKHeX DSi $TAG ($SHORT_SHA)"
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
