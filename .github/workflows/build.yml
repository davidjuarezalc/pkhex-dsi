name: Build and Release PKHeX DSi

on:
  push:
    paths-ignore:
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/pull') && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .nds with BlocksDS
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.18.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: git config --global safe.directory '*'

      - name: Install graphics conversion tool (bmp2ds)
        run: |
          curl -sL https://raw.githubusercontent.com/Universal-Team/bmp2ds/master/bmp2ds.cpp -o /tmp/bmp2ds.cpp
          g++ -O2 /tmp/bmp2ds.cpp -o /usr/local/bin/bmp2ds
          rm /tmp/bmp2ds.cpp
          chmod +x /usr/local/bin/bmp2ds

      - name: Compile PKHeX DSi
        run: |
          make -j$(nproc)
          mkdir -p artifacts
          cp -f pkhex_dsi.nds artifacts/ 2>/dev/null || cp -f pkmn-chest.nds artifacts/pkhex_dsi.nds

          if [ -f tools-linux/make_cia ]; then
            cp tools-linux/make_cia /usr/local/bin/
            chmod +x /usr/local/bin/make_cia
            make cia || true
            if [ -f pkhex_dsi.cia ]; then
              cp -f pkhex_dsi.cia artifacts/
            elif [ -f pkmn-chest.cia ]; then
              cp -f pkmn-chest.cia artifacts/pkhex_dsi.cia
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkhex-dsi-build
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pkhex-dsi-build
          path: release_assets

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
